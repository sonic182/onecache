[project]
name = "onecache"
version = "0.10.0"
description = "Python cache for sync and async code"
authors = [{ name = "Johanderson Mogollon", email = "johander1822@gmail.com" }]
readme = "README.md"
requires-python = ">=3.8"
dynamic = ["license"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Homepage = "https://github.com/sonic182/onecache"

[tool.setuptools]
packages = ["onecache"]

[tool.setuptools.exclude-package-data]
onecache = ["*.c", "*.pyx", "*.html"]

[tool.poetry]
requires-poetry = ">=2.0"

[tool.poetry.group.test.dependencies]
flake8 =  {version= "^7.1.0", python = ">=3.8.1"}
flake8-docstrings = "^1.7.0"
pytest = "^8.3.2"
pytest-asyncio = "^0.23.8"
pytest-sugar = "^1.0.0"
pytest-cov = "^5.0.0"


[tool.poetry.group.dev.dependencies]
autopep8 = {version="^2.3.1", python=">=3.8"}
sphinx = {version= "^8.0.2", python = ">=3.10"}
pylint = {version="^3.2.6", python=">=3.8"}
cython = ">=3.1"
setuptools = ">=64"

[build-system]
requires = ["setuptools>=64", "Cython>=3.1"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build-frontend = "build[uv]"
skip = ["cp3??t-*"]
environment = { ONECACHE_REQUIRE_EXTENSIONS = "1" }
test-requires = ["pytest", "pytest-asyncio"]
test-command = [
    "python -c \"import onecache, sys; sys.exit(0 if onecache.COMPILED else 'extension not loaded')\"",
    "pytest {project}/tests -q -p no:cacheprovider -o addopts=",
]
